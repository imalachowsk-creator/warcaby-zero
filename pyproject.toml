[project]
name = "warcaby-zero"
version = "0.1.0"
description = "AlphaZero-style self-play AI for 8x8 international (Brazilian) draughts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "tensorboard>=2.15",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warcaby"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer end-to-end checks (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip() without strict= is fine here
